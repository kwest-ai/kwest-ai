<!-- Detailed Feature Card Component -->
<div class="card card-detailed-feature">
  <div class="card-detailed-feature__image">
    <img src="{{ include.image }}" alt="{{ include.title }}" loading="lazy">
  </div>
  <div class="card-detailed-feature__content">
    <h3 class="card-detailed-feature__title">{{ include.title }}</h3>
    <p class="card-detailed-feature__description">{{ include.description }}</p>
  </div>
</div>
